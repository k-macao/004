# =====================================================================
# 📄 Deploy Report to Pages + 📲 WeChat Push  (整合版工作流 · 动态抓取双管线)
#
# 触发方式:
#   1. push 到 main            → 按需更新/复用社区快照 → 构建、部署并推送
#   2. Actions 手动运行         → 同上, 可用 wechat_push 开关选择是否推送微信
#   3. 每天北京时间 09:00 定时   → 自动重建站点并推送完整报告
#   4. 每 4 小时               → 检查/更新 49 源社区快照
#   5. 每 5 分钟循环           → 重建并推送；社区采集不到期时只读取快照
#
# 动态抓取管线 (每次运行均执行, 真正上线 — 行情+社区双动态):
#   market_data.py      → market_data.json      (Yahoo Finance / Stooq 多源回退抓取最新行情)
#   community_snapshot.py → community_store/*.sqlite3 (49 独立库；四小时一次；帖子间隔 10 秒)
#   community_store.py → community_data.json (从库导出静态快照，页面和推送读取后重新分析)
#   tools/probe_sentiment_apis.py → docs/sentiment-api-eval.md (量化平台舆情接口实测评分)
#   sentiment_factors.py → sentiment_data.json (聚宽/米筐/掘金/优矿 + 免费兜底源舆情·新闻因子；境内取不到则 --mock 降级)
#   build_site.py       → report.html           (把行情+社区+抓取日期注入页面与推送内容)
#                                                同时现算 04 栏 AI 预测 (下一交易日) 并把预测写进
#                                                forecast_history.json (先存档后结算, 命中率回看的唯一数据源)
#   wechat_push.py --embed                       (把最新推送负载内嵌进 report.html)
#   wechat_push.py --emit _site/wechat.json
#   wechat_push.py --push --scheduled            (推送前日期宽松校验, 单品行情/社区失败不阻断)
# =====================================================================
name: 📄 Deploy Report to Pages + 📲 WeChat Push

on:
  push:
    branches: [main]
  # ⏰ 每天北京时间 (UTC+8) 上午 09:00 自动推送 → 即 UTC 01:00
  schedule:
    - cron: '0 1 * * *'
    # 🗣️ 社区快照：四小时一次；其他事件只检查并复用同一份快照。
    - cron: '0 */4 * * *'
    # 🔄 每 5 分钟循环：重抓行情、读取社区快照 → 重建报告 → 推送微信
    #    注意: 若单次运行超过 5 分钟, 新 run 排队等上一条跑完 (不互相取消), 实际节奏 ≈ 最快每 5 分钟一轮
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      wechat_push:
        description: '推送完整报告到微信 (PushPlus)'
        type: boolean
        default: true
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 四小时采集触发独立分组，不挤掉五分钟报告；各组最多一条运行、一条待运行。
  # 社区任务另有跨工作流运行的独立锁，并按快照时间判断是否到期。
  group: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 */4 * * *' && 'community-four-hour-trigger' || 'pages-schedule-loop') || 'pages' }}
  # 不取消正在运行的社区采集，避免中断后立即重新抓取。
  cancel-in-progress: false

jobs:
  # 全仓库串行采集：相邻运行读取缓存，只有距上次尝试满 4 小时才重新抓取。
  community_snapshot:
    runs-on: ubuntu-latest
    concurrency:
      group: community-snapshot-four-hours
      cancel-in-progress: false
    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4

      - name: 🗂️ 恢复 49 个社区数据库
        uses: actions/cache/restore@v4
        with:
          path: community_store/
          key: community-store-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            community-store-v1-

      # One-time migration: a fresh v1 JSON snapshot is split into databases
      # without collecting the same sources again within four hours.
      - name: 🗂️ 恢复旧格式快照（仅用于首次迁移）
        uses: actions/cache/restore@v4
        with:
          path: community_data.json
          key: community-snapshot-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            community-snapshot-v1-

      - name: ⏱️ 检查四小时采集周期
        id: plan
        run: python3 community_snapshot.py --plan

      - name: 🗣️ 更新或复用社区快照（49 源 · 帖子间隔 10 秒）
        id: snapshot
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
        # SDK 安装与到期判断在同一进程中完成，避免临界时刻检查与采集之间跨过四小时。
        run: python3 community_snapshot.py --install-praw-if-configured

      - name: 💾 保存 49 个社区数据库
        if: ${{ steps.snapshot.outputs.written == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: community_store/
          key: community-store-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 📤 分发本轮社区数据库
        uses: actions/upload-artifact@v4
        with:
          name: community-snapshot
          path: community_store/
          if-no-files-found: error
          retention-days: 1

  # ---------- 任务 1: 动态抓取 + 动态构建 + 部署到 GitHub Pages ----------
  deploy:
    needs: community_snapshot
    # 四小时 cron 只采集；相同分钟的五分钟 cron 负责报告和推送，避免多推一次。
    if: ${{ github.event_name != 'schedule' || github.event.schedule != '0 */4 * * *' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4

      - name: 🔮 恢复 AI 预测存档 (forecast_history.json · 命中率回看的样本来源)
        uses: actions/cache/restore@v4
        with:
          path: forecast_history.json
          key: forecast-history-${{ github.run_id }}-${{ github.job }}
          restore-keys: |
            forecast-history-

      - name: 🌐 动态抓取行情 (market_data.py → market_data.json)
        run: python3 market_data.py

      - name: 📥 读取社区快照（49 源）
        uses: actions/download-artifact@v4
        with:
          name: community-snapshot
          path: community_store/

      - name: 🗃️ 从社区数据库生成静态数据（不重新抓取）
        run: python3 community_store.py --export --dir community_store --json community_data.json

      - name: 🔬 舆情接口实测 (tools/probe_sentiment_apis.py → docs/sentiment-api-eval.md)
        run: python3 tools/probe_sentiment_apis.py --mock

      - name: 🗞️ 舆情/新闻因子合成 (sentiment_factors.py → sentiment_data.json · 平台现成因子优先)
        run: |
          set +e
          timeout 240 python3 sentiment_factors.py --live --timeout 8
          if python3 -c "import json,sys;d=json.load(open('sentiment_data.json',encoding='utf-8'));sys.exit(0 if (d.get('summary') or {}).get('ok') else 1)"; then
            echo "✅ 舆情因子：境内数据源联网实测可用（平台现成因子优先）"
          else
            echo "⚠️ 舆情因子：GitHub 海外出口取不到境内数据域（聚宽/米筐等按 IP 拒绝）→ 降级离线回放 --mock，页面与推送显示降级说明"
            python3 sentiment_factors.py --mock
          fi
          set -e

      - name: 🧪 舆情层自检 (词库规则 + 11 源解析 + 站点占位符)
        run: |
          python3 sentiment_nlp.py --self-test
          python3 sentiment_adapters.py --mode mock >/dev/null
          python3 -m unittest discover -s tests

      - name: 📡 动态抓取 49 大财经 RSS 情报源 (rss_feeds.py → rssfeeds_data.json · 网页 05 节 + 微信 05 栏数据源)
        # RSSHub 是第三方公共服务，构建期也可被 build_site.py 的 ensure() 补抓；
        # 这里显式跑一次，既是一手数据源，也把逐源可用性写进 Step Summary 方便排查。
        #
        # RSSHUB_BASE：GitHub Actions 的出口 IP 会被 rsshub.app 前的 Cloudflare 直接
        # 回 403（实测整批路线集体 403，而同一路线在其它出口是 200）。所以默认挂一串
        # 探活过的社区镜像按序回退；仓库变量 RSSHUB_BASE 可整体覆盖（例如自建实例、
        # 或用 RSSHUB_PROXY 指定出站代理换出口）。
        env:
          RSSHUB_BASE: ${{ vars.RSSHUB_BASE }}
          RSSHUB_PROXY: ${{ secrets.RSSHUB_PROXY }}
          # DeepSeek Search API：只给「RSS 路由坏死 / 站点端点消失」的源做检索兜底。
          # 没有配这个 secret 时自动跳过，逐源照旧如实标「未获取」。
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          # --budget 240：接近墙钟上限时剩余源记 skipped_deadline，**仍然写出** JSON，
          # 而不是让 SIGTERM 半路杀掉、一条都用不上（2026-10-31 实测：串行 49 源 +
          # 多实例回退会正好撞上 timeout 300，整步被掐断；随后 build_site 只用 90s
          # 预算补抓，31 源连请求都没发出）。并发 + 软预算后两者都不会再发生。
          timeout 300 python3 rss_feeds.py --json rssfeeds_data.json --days 14 --budget 240 --text > rss_summary.txt 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ] || [ ! -s rssfeeds_data.json ]; then
            echo "⚠️ RSS 情报源当次抓取失败（rc=$rc）：05 节将显示「今日未获取」，不回填历史标题（构建与推送不因此中断）" | tee -a rss_summary.txt
            echo "::warning title=04/05 数据不全::RSS 抓取失败 rc=$rc 或产物为空 —— 01/04 覆盖度会按缺口下调"
          fi
          cat rss_summary.txt
          { echo '### 📡 05 栏 49 大财经 RSS 情报源（仅保留 14 天内、日期可解析的条目）'; echo '```'; cat rss_summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"


      - name: 🏗️ 动态构建报告 (build_site.py → report.html · 行情+社区双注入)
        # 上一步若没写出产物，build_site 的 ensure() 会就地补抓 —— 补抓同样要用
        # DeepSeek 检索兜底，所以这里必须把 key 一起传下去，否则「已配置 key」在
        # 补抓路径上等于没配（2026-10-31 线上实测：05 节显示「未启用」）。
        env:
          RSSHUB_BASE: ${{ vars.RSSHUB_BASE }}
          RSSHUB_PROXY: ${{ secrets.RSSHUB_PROXY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 build_site.py

      - name: 💾 保存 AI 预测存档 (供下次运行结算已到期的预测)
        # key 带 job 名：schedule 触发时 deploy 与 daily 并行，同 key 保存会撞车
        # （Actions 的 cache key 不可覆盖）；restore 用前缀回退，照样取到最新那份。
        # hashFiles 守卫：build_site.py 没跑成时文件不存在，直接 save 会报路径错误。
        if: always() && hashFiles('forecast_history.json') != ''
        uses: actions/cache/save@v4
        with:
          path: forecast_history.json
          key: forecast-history-${{ github.run_id }}-${{ github.job }}

      - name: 🧩 内嵌微信推送负载 (wechat-parts → report.html)
        env:
          RSSHUB_BASE: ${{ vars.RSSHUB_BASE }}
          RSSHUB_PROXY: ${{ secrets.RSSHUB_PROXY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 tools/wechat_push.py --embed

      - name: 📁 准备部署目录
        run: |
          mkdir -p _site
          cp report.html _site/index.html
          cp market_data.json _site/market_data.json
          cp community_data.json _site/community_data.json || echo "community_data.json not found, skip"
          cp sentiment_data.json _site/sentiment_data.json || echo "sentiment_data.json not found, skip"
          cp -r docs _site/docs 2>/dev/null || echo "docs/ not found, skip"

      - name: 🧩 生成微信推送内容 (wechat.json)
        env:
          RSSHUB_BASE: ${{ vars.RSSHUB_BASE }}
          RSSHUB_PROXY: ${{ secrets.RSSHUB_PROXY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 tools/wechat_push.py --emit _site/wechat.json

      - name: ⚙️ 配置 Pages
        uses: actions/configure-pages@v5

      - name: 📤 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 🚀 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------- 任务 2: 动态抓取 + 推送完整报告到微信 (push / 手动触发) ----------
  # 独立任务:Pages 部署成功后再推送;推送失败不影响网站部署状态
  # 每次运行重抓行情并读取本轮社区快照，渲染前重新分析；社区采集时间与分析时间分开。
  # --scheduled 对社区核验日期仅警告；行情准确性 FAIL 仍阻断推送。
  wechat:
    needs: deploy
    if: ${{ github.event_name == 'push' || inputs.wechat_push }}
    runs-on: ubuntu-latest
    env:
      # 可选:在仓库 Settings → Secrets 配置 PUSHPLUS_TOKEN 可覆盖
      # report.html 中的 token;不配置时自动从 report.html 读取
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4

      - name: 🔮 恢复 AI 预测存档 (forecast_history.json · 命中率回看的样本来源)
        uses: actions/cache/restore@v4
        with:
          path: forecast_history.json
          key: forecast-history-${{ github.run_id }}-${{ github.job }}
          restore-keys: |
            forecast-history-

      - name: 🌐 动态抓取行情 (market_data.py)
        run: python3 market_data.py

      - name: 📥 读取社区快照（49 源）
        uses: actions/download-artifact@v4
        with:
          name: community-snapshot
          path: community_store/

      - name: 🗃️ 从社区数据库生成静态数据（不重新抓取）
        run: python3 community_store.py --export --dir community_store --json community_data.json

      - name: 🔬 舆情接口实测 (tools/probe_sentiment_apis.py → docs/sentiment-api-eval.md)
        run: python3 tools/probe_sentiment_apis.py --mock

      - name: 🗞️ 舆情/新闻因子合成 (sentiment_factors.py → sentiment_data.json · 平台现成因子优先)
        run: |
          set +e
          timeout 240 python3 sentiment_factors.py --live --timeout 8
          if python3 -c "import json,sys;d=json.load(open('sentiment_data.json',encoding='utf-8'));sys.exit(0 if (d.get('summary') or {}).get('ok') else 1)"; then
            echo "✅ 舆情因子：境内数据源联网实测可用（平台现成因子优先）"
          else
            echo "⚠️ 舆情因子：GitHub 海外出口取不到境内数据域（聚宽/米筐等按 IP 拒绝）→ 降级离线回放 --mock，页面与推送显示降级说明"
            python3 sentiment_factors.py --mock
          fi
          set -e
      - name: 📡 动态抓取 49 大财经 RSS 情报源 (rss_feeds.py → rssfeeds_data.json · 网页 05 节 + 微信 05 栏数据源)
        # RSSHub 是第三方公共服务，构建期也可被 build_site.py 的 ensure() 补抓；
        # 这里显式跑一次，既是一手数据源，也把逐源可用性写进 Step Summary 方便排查。
        #
        # RSSHUB_BASE：GitHub Actions 的出口 IP 会被 rsshub.app 前的 Cloudflare 直接
        # 回 403（实测整批路线集体 403，而同一路线在其它出口是 200）。所以默认挂一串
        # 探活过的社区镜像按序回退；仓库变量 RSSHUB_BASE 可整体覆盖（例如自建实例、
        # 或用 RSSHUB_PROXY 指定出站代理换出口）。
        env:
          RSSHUB_BASE: ${{ vars.RSSHUB_BASE }}
          RSSHUB_PROXY: ${{ secrets.RSSHUB_PROXY }}
          # DeepSeek Search API：只给「RSS 路由坏死 / 站点端点消失」的源做检索兜底。
          # 没有配这个 secret 时自动跳过，逐源照旧如实标「未获取」。
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          # --budget 240：接近墙钟上限时剩余源记 skipped_deadline，**仍然写出** JSON，
          # 而不是让 SIGTERM 半路杀掉、一条都用不上（2026-10-31 实测：串行 49 源 +
          # 多实例回退会正好撞上 timeout 300，整步被掐断；随后 build_site 只用 90s
          # 预算补抓，31 源连请求都没发出）。并发 + 软预算后两者都不会再发生。
          timeout 300 python3 rss_feeds.py --json rssfeeds_data.json --days 14 --budget 240 --text > rss_summary.txt 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ] || [ ! -s rssfeeds_data.json ]; then
            echo "⚠️ RSS 情报源当次抓取失败（rc=$rc）：05 节将显示「今日未获取」，不回填历史标题（构建与推送不因此中断）" | tee -a rss_summary.txt
            echo "::warning title=04/05 数据不全::RSS 抓取失败 rc=$rc 或产物为空 —— 01/04 覆盖度会按缺口下调"
          fi
          cat rss_summary.txt
          { echo '### 📡 05 栏 49 大财经 RSS 情报源（仅保留 14 天内、日期可解析的条目）'; echo '```'; cat rss_summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"



      - name: 🏗️ 动态构建报告 (build_site.py · 行情+社区双注入)
        env:
          RSSHUB_BASE: ${{ vars.RSSHUB_BASE }}
          RSSHUB_PROXY: ${{ secrets.RSSHUB_PROXY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 build_site.py

      - name: 💾 保存 AI 预测存档 (供下次运行结算已到期的预测)
        # key 带 job 名：schedule 触发时 deploy 与 daily 并行，同 key 保存会撞车
        # （Actions 的 cache key 不可覆盖）；restore 用前缀回退，照样取到最新那份。
        # hashFiles 守卫：build_site.py 没跑成时文件不存在，直接 save 会报路径错误。
        if: always() && hashFiles('forecast_history.json') != ''
        uses: actions/cache/save@v4
        with:
          path: forecast_history.json
          key: forecast-history-${{ github.run_id }}-${{ github.job }}

      - name: 🧩 内嵌微信推送负载
        run: python3 tools/wechat_push.py --embed

      - name: 📲 推送完整报告到微信 (PushPlus)
        run: |
          set +e
          OUT=$(python3 tools/wechat_push.py --push --scheduled 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          {
            echo '### 📲 微信推送结果'
            echo '```text'
            echo "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE

  # ---------- 任务 3: 定时触发自动抓取 + 重建 + 推送 (每天 09:00 + 每 5 分钟循环) ----------
  # 仅 schedule 触发时运行, 避免 push/手动触发时与 wechat 任务重复推送
  daily:
    needs: community_snapshot
    if: ${{ github.event_name == 'schedule' && github.event.schedule != '0 */4 * * *' }}
    runs-on: ubuntu-latest
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4

      - name: 🔮 恢复 AI 预测存档 (forecast_history.json · 命中率回看的样本来源)
        uses: actions/cache/restore@v4
        with:
          path: forecast_history.json
          key: forecast-history-${{ github.run_id }}-${{ github.job }}
          restore-keys: |
            forecast-history-

      - name: 🌐 动态抓取行情 (market_data.py)
        run: python3 market_data.py

      - name: 📥 读取社区快照（49 源）
        uses: actions/download-artifact@v4
        with:
          name: community-snapshot
          path: community_store/

      - name: 🗃️ 从社区数据库生成静态数据（不重新抓取）
        run: python3 community_store.py --export --dir community_store --json community_data.json

      - name: 🔬 舆情接口实测 (tools/probe_sentiment_apis.py → docs/sentiment-api-eval.md)
        run: python3 tools/probe_sentiment_apis.py --mock

      - name: 🗞️ 舆情/新闻因子合成 (sentiment_factors.py → sentiment_data.json · 平台现成因子优先)
        run: |
          set +e
          timeout 240 python3 sentiment_factors.py --live --timeout 8
          if python3 -c "import json,sys;d=json.load(open('sentiment_data.json',encoding='utf-8'));sys.exit(0 if (d.get('summary') or {}).get('ok') else 1)"; then
            echo "✅ 舆情因子：境内数据源联网实测可用（平台现成因子优先）"
          else
            echo "⚠️ 舆情因子：GitHub 海外出口取不到境内数据域（聚宽/米筐等按 IP 拒绝）→ 降级离线回放 --mock，页面与推送显示降级说明"
            python3 sentiment_factors.py --mock
          fi
      - name: 📡 动态抓取 49 大财经 RSS 情报源 (rss_feeds.py → rssfeeds_data.json · 网页 05 节 + 微信 05 栏数据源)
        # RSSHub 是第三方公共服务，构建期也可被 build_site.py 的 ensure() 补抓；
        # 这里显式跑一次，既是一手数据源，也把逐源可用性写进 Step Summary 方便排查。
        #
        # RSSHUB_BASE：GitHub Actions 的出口 IP 会被 rsshub.app 前的 Cloudflare 直接
        # 回 403（实测整批路线集体 403，而同一路线在其它出口是 200）。所以默认挂一串
        # 探活过的社区镜像按序回退；仓库变量 RSSHUB_BASE 可整体覆盖（例如自建实例、
        # 或用 RSSHUB_PROXY 指定出站代理换出口）。
        env:
          RSSHUB_BASE: ${{ vars.RSSHUB_BASE }}
          RSSHUB_PROXY: ${{ secrets.RSSHUB_PROXY }}
          # DeepSeek Search API：只给「RSS 路由坏死 / 站点端点消失」的源做检索兜底。
          # 没有配这个 secret 时自动跳过，逐源照旧如实标「未获取」。
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          # --budget 240：接近墙钟上限时剩余源记 skipped_deadline，**仍然写出** JSON，
          # 而不是让 SIGTERM 半路杀掉、一条都用不上（2026-10-31 实测：串行 49 源 +
          # 多实例回退会正好撞上 timeout 300，整步被掐断；随后 build_site 只用 90s
          # 预算补抓，31 源连请求都没发出）。并发 + 软预算后两者都不会再发生。
          timeout 300 python3 rss_feeds.py --json rssfeeds_data.json --days 14 --budget 240 --text > rss_summary.txt 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ] || [ ! -s rssfeeds_data.json ]; then
            echo "⚠️ RSS 情报源当次抓取失败（rc=$rc）：05 节将显示「今日未获取」，不回填历史标题（构建与推送不因此中断）" | tee -a rss_summary.txt
            echo "::warning title=04/05 数据不全::RSS 抓取失败 rc=$rc 或产物为空 —— 01/04 覆盖度会按缺口下调"
          fi
          cat rss_summary.txt
          { echo '### 📡 05 栏 49 大财经 RSS 情报源（仅保留 14 天内、日期可解析的条目）'; echo '```'; cat rss_summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"


          set -e

      - name: 🏗️ 动态构建报告 (build_site.py · 行情+社区+宏观快讯注入)
        env:
          RSSHUB_BASE: ${{ vars.RSSHUB_BASE }}
          RSSHUB_PROXY: ${{ secrets.RSSHUB_PROXY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 build_site.py

      - name: 💾 保存 AI 预测存档 (供下次运行结算已到期的预测)
        # key 带 job 名：schedule 触发时 deploy 与 daily 并行，同 key 保存会撞车
        # （Actions 的 cache key 不可覆盖）；restore 用前缀回退，照样取到最新那份。
        # hashFiles 守卫：build_site.py 没跑成时文件不存在，直接 save 会报路径错误。
        if: always() && hashFiles('forecast_history.json') != ''
        uses: actions/cache/save@v4
        with:
          path: forecast_history.json
          key: forecast-history-${{ github.run_id }}-${{ github.job }}

      - name: 🧩 内嵌微信推送负载
        run: python3 tools/wechat_push.py --embed

      - name: 📲 推送完整报告到微信 (PushPlus · 定时宽松校验)
        run: |
          set +e
          OUT=$(python3 tools/wechat_push.py --push --scheduled 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          {
            echo '### 📲 微信推送结果（定时 09:00 / 5 分钟循环）'
            echo '```text'
            echo "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE
